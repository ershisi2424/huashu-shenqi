name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-contract:
    # Keep the contract job on the same runner image as the installer smoke
    # job; windows-latest can move ahead and force better-sqlite3 into an
    # unplanned node-gyp/Visual Studio source build.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node test-windows-ci-contract.cjs
      - run: node test-windows-release.cjs
      - run: node test-windows-launcher.cjs
