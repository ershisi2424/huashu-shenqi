name: Windows installer smoke

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node test-windows-ci-contract.cjs
      - shell: pwsh
        run: .\scripts\windows\ci-install-smoke.ps1 -SourceRoot $PWD
